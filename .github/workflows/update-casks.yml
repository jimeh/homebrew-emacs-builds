---
name: Update Casks
concurrency: jimeh/homebrew-emacs-builds/update-casks
on:
  workflow_dispatch:
    inputs:
      cask:
        description: "Specific cask to update (all if empty)"
        required: false
        default: ""
      extraArgs:
        description: "Extra arguments passed to emacs-builder cask update"
        required: false
        default: ""
      dryRun:
        description: >-
          Dry run: render casks and meta files and show the changes, without
          committing or pushing anything
        type: boolean
        required: false
        default: false

permissions: {}

jobs:
  emacs-builder:
    runs-on: "macos-15"
    permissions:
      contents: read
    steps:
      - id: builder_ref
        run: |
          BUILDER_REF=v0.6.65
          echo "ref=${BUILDER_REF}" >> "$GITHUB_OUTPUT"
      - name: Cache emacs-builder (${{ runner.arch }})
        id: cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: bin/emacs-builder
          key: emacs-builder-${{ runner.arch }}-${{ steps.builder_ref.outputs.ref }}-0-bin
      - name: Checkout build-emacs-for-macos repo
        if: steps.cache.outputs.cache-hit != 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: jimeh/build-emacs-for-macos
          ref: ${{ steps.builder_ref.outputs.ref }}
          fetch-depth: 0
          persist-credentials: false
      - name: Setup Go
        if: steps.cache.outputs.cache-hit != 'true'
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: "go.mod"
      - name: Build emacs-builder tool
        if: steps.cache.outputs.cache-hit != 'true'
        run: make build
      - name: Ensure emacs-builder is executable
        if: steps.cache.outputs.cache-hit != 'true'
        run: chmod +x bin/emacs-builder
      - run: bin/emacs-builder --version
      - name: Upload emacs-builder artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: emacs-builder-${{ runner.arch }}
          path: bin/emacs-builder
          if-no-files-found: error

  live-check:
    runs-on: "macos-15"
    permissions:
      contents: read
    outputs:
      tap_sha: ${{ steps.tap_sha.outputs.sha }}
    steps:
      - name: Checkout tap repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          path: tap
          persist-credentials: false
      - name: Store tap Git SHA
        id: tap_sha
        working-directory: tap
        run: |
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - name: Copy tap repository to homebrew tap
        run: |
          mkdir -p "$(brew --repo)/Library/Taps/jimeh"
          cp -av "${GITHUB_WORKSPACE}/tap" \
             "$(brew --repo)/Library/Taps/jimeh/homebrew-emacs-builds"
      - name: Trust homebrew tap
        run: brew trust --tap jimeh/emacs-builds
      - name: Run brew update
        run: brew update
      - name: brew livecheck (all casks)
        if: ${{ inputs.cask == '' }}
        shell: bash
        run: >-
          brew livecheck --json --quiet --tap jimeh/emacs-builds
          | tee livecheck-results.json
      - name: brew livecheck (specific cask)
        if: ${{ inputs.cask != '' }}
        shell: bash
        env:
          CASK: ${{ inputs.cask }}
        run: >-
          brew livecheck --json --quiet
          "jimeh/emacs-builds/${CASK}"
          | tee livecheck-results.json
      - name: Upload livecheck-results.json artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: livecheck-results.json
          path: livecheck-results.json
          if-no-files-found: error

  update-casks:
    runs-on: "macos-15"
    needs: [emacs-builder, live-check]
    permissions:
      contents: write # emacs-builder commits casks via the contents API
    steps:
      - name: Checkout tap repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.live-check.outputs.tap_sha }}
          path: tap
          persist-credentials: false
      - name: Download pre-built emacs-builder artifact
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: emacs-builder-${{ runner.arch }}
          path: bin
      - name: Ensure emacs-builder is executable
        run: chmod +x bin/emacs-builder
      - name: Download livecheck-results.json artifact
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: livecheck-results.json
          path: ./
      - name: Update casks
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DRY_RUN: ${{ inputs.dryRun }}
          EXTRA_ARGS: ${{ inputs.extraArgs }}
        run: |
          read -r -a extra_args <<< "${EXTRA_ARGS}"
          # Dry run writes casks into the tap checkout instead of committing.
          output_args=()
          if [[ "${DRY_RUN}" == "true" ]]; then
            output_args=(--output tap/Casks)
          fi
          bin/emacs-builder \
            cask --builds-repository jimeh/emacs-builds \
            update --templates-dir tap/templates \
            ${output_args[@]+"${output_args[@]}"} \
            ${extra_args[@]+"${extra_args[@]}"} \
            livecheck-results.json
      - name: Show cask changes (dry run)
        if: ${{ inputs.dryRun }}
        working-directory: tap
        run: |
          git status --short
          git diff --stat
          git diff

  update-meta:
    runs-on: "macos-15"
    needs: [update-casks]
    permissions:
      contents: write # git-auto-commit-action pushes to the meta branch
    steps:
      - name: Checkout tap repository main branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          path: tap
          persist-credentials: false
      - name: Copy tap repository to homebrew tap
        run: |
          mkdir -p "$(brew --repo)/Library/Taps/jimeh"
          cp -av "${GITHUB_WORKSPACE}/tap" \
             "$(brew --repo)/Library/Taps/jimeh/homebrew-emacs-builds"
      - name: Trust homebrew tap
        run: brew trust --tap jimeh/emacs-builds
      # git-auto-commit-action pushes using the persisted checkout credentials.
      - name: Checkout tap repository meta branch # zizmor: ignore[artipacked]
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: meta
          path: meta
      - name: Install meta dependencies
        run: brew bundle
        working-directory: meta
      - name: Update meta files
        run: make update
        working-directory: meta
      - name: Show meta changes (dry run)
        if: ${{ inputs.dryRun }}
        working-directory: meta
        run: |
          git status --short
          git diff --stat
      - name: commit and push changes to meta branch
        if: ${{ !inputs.dryRun }}
        uses: stefanzweifel/git-auto-commit-action@d0b01107b5db882071f96de5dd4b54961ea93f4c # v7.2.1
        with:
          commit_message: "chore(meta): update meta files"
          repository: meta
          branch: meta
          commit_user_name: github-actions[bot]
          commit_user_email: github-actions[bot]@users.noreply.github.com
          commit_author: >-
            github-actions[bot] <github-actions[bot]@users.noreply.github.com>
          skip_dirty_check: false
